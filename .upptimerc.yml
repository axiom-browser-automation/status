# Axiom service status — https://axiom-browser-automation.github.io/status/
# The five sites check status JSON files synced into status/ by Jenkins. $STATUS_JSON_BASE is a repo
# secret holding the public raw.githubusercontent.com base URL: a $-placeholder URL is how upptime
# keeps the service pages from linking the monitored URL (here the raw JSON).
# Support/health-compile (see axiom_monorepo features/AXIOM-6369.md).
# A site is DOWN whenever its file lacks the `"status":"up"` marker
# (covers a synced "down"/"stale", a malformed body, or a missing file).
owner: axiom-browser-automation
repo: status

sites:
  - name: Website
    url: $STATUS_JSON_BASE/website.json
    __dangerous__body_down_if_text_missing: '"status":"up"'
  - name: Cloud
    url: $STATUS_JSON_BASE/cloud.json
    __dangerous__body_down_if_text_missing: '"status":"up"'
  - name: CDP
    url: $STATUS_JSON_BASE/cdp.json
    __dangerous__body_down_if_text_missing: '"status":"up"'
  - name: Extension
    url: $STATUS_JSON_BASE/extension.json
    __dangerous__body_down_if_text_missing: '"status":"up"'
  - name: Scheduler
    url: $STATUS_JSON_BASE/scheduler.json
    __dangerous__body_down_if_text_missing: '"status":"up"'

status-website:
  baseUrl: /status
  name: Axiom Status
  introTitle: "**Axiom.ai** service status"
  introMessage: Live status of the Axiom browser-automation platform — website, cloud browsers, CDP, extension backend, and scheduler.
  navbar:
    - title: Status
      href: /status/

assignees:
  - yaseersheriff
