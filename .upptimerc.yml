# Axiom service status — https://axiom-browser-automation.github.io/status/
# The five sites check status JSON files synced into status/ by Jenkins
# Support/health-compile (see axiom_monorepo features/AXIOM-6369.md).
# A site is DOWN whenever its file lacks the `"status":"up"` marker
# (covers a synced "down"/"stale", a malformed body, or a missing file).
owner: axiom-browser-automation
repo: status

sites:
  - name: Website
    url: https://raw.githubusercontent.com/axiom-browser-automation/status/HEAD/status/website.json
    __dangerous__body_down_if_text_missing: '"status":"up"'
  - name: Cloud
    url: https://raw.githubusercontent.com/axiom-browser-automation/status/HEAD/status/cloud.json
    __dangerous__body_down_if_text_missing: '"status":"up"'
  - name: CDP
    url: https://raw.githubusercontent.com/axiom-browser-automation/status/HEAD/status/cdp.json
    __dangerous__body_down_if_text_missing: '"status":"up"'
  - name: Extension
    url: https://raw.githubusercontent.com/axiom-browser-automation/status/HEAD/status/extension.json
    __dangerous__body_down_if_text_missing: '"status":"up"'
  - name: Scheduler
    url: https://raw.githubusercontent.com/axiom-browser-automation/status/HEAD/status/scheduler.json
    __dangerous__body_down_if_text_missing: '"status":"up"'

status-website:
  baseUrl: /status
  name: Axiom Status
  introTitle: "**Axiom.ai** service status"
  introMessage: Live status of the Axiom browser-automation platform — website, cloud browsers, CDP, extension backend, and scheduler.
  navbar:
    - title: Status
      href: /status/

assignees:
  - yaseersheriff
